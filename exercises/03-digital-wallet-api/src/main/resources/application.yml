server:
  port: 8080

logging:
  level:
    org.flywaydb: DEBUG
    org.springframework.jdbc: DEBUG


spring:
  application:
    name: digital-wallet-api

  #Postgres Connection Configuration
  datasource:
    url: jdbc:postgresql://localhost:5432/apex_wallet
    username: wallet_admin
    password: wallet_secret
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000

  # Production JPA Rule: Hibernate validates, Flyway migrates
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false # Production Best Practice: release DB connections immediately after service finishes

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# Management & Swagger UI
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html