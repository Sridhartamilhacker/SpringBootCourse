plugins{
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'

}

group='com.apex'
version='1.0-SNAPSHOT'

java {
    toolchain{
        languageVersion = JavaLanguageVersion.of(27)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // 1. Web & REST API
        implementation 'org.springframework.boot:spring-boot-starter-web'

        // 2. Spring Data JPA & HikariCP Connection Pooling
        implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

        // 3. Real PostgreSQL Driver
        runtimeOnly 'org.postgresql:postgresql'

        // 4. Flyway Database Migrations
        implementation 'org.flywaydb:flyway-core'
        implementation 'org.flywaydb:flyway-database-postgresql'

        // 5. Bean Validation (@Valid, @Positive, etc.)
        implementation 'org.springframework.boot:spring-boot-starter-validation'

        // 6. Actuator Telemetry & Health Checks
        implementation 'org.springframework.boot:spring-boot-starter-actuator'

        // 7. Interactive OpenAPI 3 / Swagger UI Docs
        implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.2.0'

        // DevTools for live reload
        developmentOnly 'org.springframework.boot:spring-boot-devtools'

        // Testing
        testImplementation 'org.springframework.boot:spring-boot-starter-test'

}

tasks.named('test'){
    useJUnitPlatform()
}