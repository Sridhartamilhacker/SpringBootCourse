plugins{
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'

}

group='com.apex'
version='1.0-SNAPSHOT'

java {
    toolchain{
        languageVersion = JavaLanguageVersion.of(27)
    }
}

repositories {
    mavenCentral()
    maven {
        url "https://download.red-gate.com/maven/release"
    }
}

dependencies {
    // 1. Web & REST API
        implementation 'org.springframework.boot:spring-boot-starter-web'

        // 2. Spring Data JPA & HikariCP Connection Pooling
        implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

        // 3. Real PostgreSQL Driver
        runtimeOnly 'org.postgresql:postgresql'

        // 4. Flyway Database Migrations
        implementation 'org.springframework.boot:spring-boot-starter-flyway'
        implementation 'org.flywaydb:flyway-database-postgresql'


        // 5. Bean Validation (@Valid, @Positive, etc.)
        implementation 'org.springframework.boot:spring-boot-starter-validation'

        // 6. Actuator Telemetry & Health Checks
        implementation 'org.springframework.boot:spring-boot-starter-actuator'

        // 7. Interactive OpenAPI 3 / Swagger UI Docs
        implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.2.0'

        // DevTools for live reload
        developmentOnly 'org.springframework.boot:spring-boot-devtools'
        compileOnly("org.projectlombok:lombok:1.18.48")
        annotationProcessor("org.projectlombok:lombok:1.18.48")

        testCompileOnly("org.projectlombok:lombok:1.18.48")
        testAnnotationProcessor("org.projectlombok:lombok:1.18.48")

        // Testing
        testImplementation 'org.springframework.boot:spring-boot-starter-test'

            // 8. Spring Security
        implementation 'org.springframework.boot:spring-boot-starter-security'

        // 9. JJWT (JSON Web Token Library)
        implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
        runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
        runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

        // Security Test utilities
        testImplementation 'org.springframework.security:spring-security-test'

}

tasks.named('test') {
    useJUnitPlatform()
}

def byteBuddyAgentFiles = files({
    configurations.testRuntimeClasspath.filter { it.name.contains("byte-buddy-agent") }
})

tasks.withType(Test).configureEach {
    jvmArgumentProviders.add(new CommandLineArgumentProvider() {
        @Override
        Iterable<String> asArguments() {
            byteBuddyAgentFiles.files.collect { "-javaagent:${it.absolutePath}" }
        }
    })
}